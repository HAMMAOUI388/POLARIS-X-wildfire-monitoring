[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-x"
version = "0.1.0"
description = "Wildfire monitoring database foundation for POLARIS X"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "geoalchemy2>=0.15,<1",
  "shapely>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "Flask>=3.0,<4",
  "Flask-Cors>=4,<7",
  "Flask-JWT-Extended>=4.6,<5",
  "pydantic>=2.9,<3",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
